{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Sign in" %} · Conceito OS{% endblock %}

{% block content %}
  <h1>{% trans "Sign in" %}</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">{% trans "Sign in" %}</button>
  </form>
{% endblock %}
