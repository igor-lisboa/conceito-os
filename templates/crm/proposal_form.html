{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "New proposal" %} · Conceito OS{% endblock %}

{% block content %}
  <h1>{% trans "New proposal" %}</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% trans "Save proposal" %}</button>
    <a href="{% url 'proposal_list' %}">{% trans "Cancel" %}</a>
  </form>
{% endblock %}
