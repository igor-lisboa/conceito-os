# Local PostgreSQL and Mailpit for development and tests. Not used in production (see docs/deployment.md).
#
#   docker compose up -d        start the database and wait until it is healthy
#   docker compose logs -f db   follow the server log
#   docker compose down         stop it (data is kept in the volume)
#   docker compose down -v      stop it AND delete all local data
#
# The passwords below are for this machine only. Override them with a .env file
# next to this file if you want different values.

services:
  # Local SMTP server with a web inbox. Nothing is sent to the internet.
  # Open http://127.0.0.1:8025 to read the emails the app sends (welcome, password reset).
  mailpit:
    image: axllent/mailpit:v1.28.2
    container_name: conceito-os-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # SMTP, used by the app
      - "127.0.0.1:8025:8025"  # web inbox, used by you
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # Local PostgreSQL, the only database engine. Tests use it with TEST_DATABASE=postgres.
  # Bound to localhost only.
  postgres:
    image: postgres:17
    container_name: conceito-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conceito_os}
      POSTGRES_USER: ${POSTGRES_USER:-conceito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conceito-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conceito} -d ${POSTGRES_DB:-conceito_os}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
