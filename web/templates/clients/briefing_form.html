{% extends "base.html" %}
{% load i18n %}

{% block content %}
  <h1>{% trans "Briefing" %} · {{ object.client.name }}</h1>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% trans "Save briefing" %}</button>
    <a href="{% url 'client_detail' object.client.pk %}">{% trans "Back" %}</a>
  </form>
{% endblock %}
